<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Impara Giocando</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header con nome e punteggio -->
    <header class="header">
        <div class="user-info">
            <span id="userName" class="user-name">👤</span>
            <span id="score" class="score">🏆 0</span>
        </div>
    </header>

    <!-- Schermata di selezione lingua -->
    <div id="languageScreen" class="screen active">
        <div class="title">
            <h1>🎮 Scegli la Lingua</h1>
        </div>
        <div class="language-buttons">
            <button class="language-btn" data-lang="it">
                🇮🇹
            </button>
            <button class="language-btn" data-lang="es">
                🇪🇸
            </button>
            <button class="language-btn" data-lang="en">
                🇬🇧
            </button>
        </div>
        </div>

    <!-- Schermata di inserimento nome -->
    <div id="nameScreen" class="screen">
        <div class="title">
            <h1 id="namePrompt">🎤 Dimmi il tuo nome</h1>
        </div>
        <div class="name-input">
            <button id="recordBtn" class="record-btn">
                🎤
            </button>
            <input type="text" id="nameInput" class="name-input-field" placeholder="Oppure scrivi qui...">
            <button id="confirmNameBtn" class="confirm-btn">
                ✅
            </button>
            </div>
            <div class="voice-status" id="voiceStatus"></div>
            </div>

    <!-- Schermata di selezione giochi -->
    <div id="gameScreen" class="screen">
        <div class="title">
            <h1 id="gameTitle">🎯 Scegli il Gioco</h1>
        </div>
        <div class="games-grid">
            <button class="game-btn active" data-game="colors">
                🎨
                <span id="colorsGameLabel">Colori</span>
            </button>
            <button class="game-btn" data-game="numbers">
                🔢
                <span id="numbersGameLabel">Numeri</span>
            </button>
            <button class="game-btn" data-game="animals">
                🐶
                <span id="animalsGameLabel">Animali</span>
            </button>
            <button class="game-btn locked">
                🔒
                <span id="shapesGameLabel">Forme</span>
            </button>
        </div>
    </div>

    <!-- Gioco dei colori -->
    <div id="colorGameScreen" class="screen">
        <div class="game-header">
            <button id="backBtn" class="back-btn">↩️</button>
            <h2 id="colorGameTitle">🎨 Gioco dei Colori</h2>
        </div>
        <div class="game-instruction" id="gameInstruction">
            Clicca il colore che senti!
        </div>
        <div class="color-grid" id="colorGrid">
            <div class="color-square" data-color="0"></div>
            <div class="color-square" data-color="1"></div>
            <div class="color-square" data-color="2"></div>
            <div class="color-square" data-color="3"></div>
        </div>
        <div class="game-controls">
            <button id="playAgainBtn" class="play-btn">🔊</button>
            <button id="nextRoundBtn" class="next-btn" style="display: none;">➡️</button>
        </div>
        <div class="feedback" id="feedback"></div>
    </div>

    <!-- Gioco dei numeri -->
    <div id="numberGameScreen" class="screen">
        <div class="game-header">
            <button id="numberBackBtn" class="back-btn">↩️</button>
            <h2 id="numberGameTitle">🔢 Gioco dei Numeri</h2>
        </div>
        <div class="game-instruction" id="numberGameInstruction">
            Clicca il numero che senti!
        </div>
        <div class="number-grid">
            <div class="number-square" data-number="0"></div>
            <div class="number-square" data-number="1"></div>
            <div class="number-square" data-number="2"></div>
            <div class="number-square" data-number="3"></div>
        </div>
        <div class="game-controls">
            <button id="numberPlayAgainBtn" class="play-btn">🔊</button>
            <button id="numberNextRoundBtn" class="next-btn" style="display: none;">➡️</button>
        </div>
        <div class="feedback" id="numberFeedback"></div>
    </div>

    <!-- Gioco degli animali -->
    <div id="animalGameScreen" class="screen">
        <div class="game-header">
            <button id="animalBackBtn" class="back-btn">↩️</button>
            <h2 id="animalGameTitle">🐶 Gioco degli Animali</h2>
        </div>
        <div class="game-instruction" id="animalGameInstruction">
            Clicca l'animale che senti!
        </div>
        <div class="animal-grid">
            <div class="animal-square" data-animal="0"></div>
            <div class="animal-square" data-animal="1"></div>
            <div class="animal-square" data-animal="2"></div>
            <div class="animal-square" data-animal="3"></div>
        </div>
        <div class="game-controls">
            <button id="animalPlayAgainBtn" class="play-btn">🔊</button>
            <button id="animalNextRoundBtn" class="next-btn" style="display: none;">➡️</button>
        </div>
        <div class="feedback" id="animalFeedback"></div>
    </div>
